<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kikokotoo Kisasa</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #fdf0ca;
        }

        .calculator {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            width: 320px;
        }

        #display {
            width: 100%;
            height: 70px;
            background-color: #0f172a;
            border: none;
            border-radius: 10px;
            margin-bottom: 20px;
            color: #ffffff;
            font-size: 2rem;
            text-align: right;
            padding: 15px;
            outline: none;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            padding: 20px;
            border-radius: 12px;
            border: none;
            font-size: 1.25rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            background-color: #37da3f;
            color: #ffffff;
        }

        button:active {
            transform: scale(0.95);
        }

        button.operator {
            background-color: #f97316;
            color: #ffffff;
        }

        button.operator:hover {
            background-color: #ea580c;
        }

        button.clear {
            background-color: #ef4444;
            color: #ffffff;
        }

        button.clear:hover {
            background-color: #dc2626;
        }

        button.equal {
            background-color: #22c55e;
            color: #ffffff;
            grid-column: span 2;
        }

        button.equal:hover {
            background-color: #16a34a;
        }

        button:hover:not(.operator):not(.clear):not(.equal) {
            background-color: #518cdf;
        }
    </style>
</head>
<body>

    <div class="calculator">
        <!-- Sehemu ya kuonyesha namba -->
        <input type="text" id="display" readonly placeholder="0">
        
        <!-- Vitufe vya kikokotoo -->
        <div class="buttons">
            <button class="clear" onclick="clearDisplay()">C</button>
            <button onclick="appendValue('/')" class="operator">/</button>
            <button onclick="appendValue('*')" class="operator">*</button>
            <button onclick="appendValue('-')" class="operator">-</button>
            
            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button onclick="appendValue('+')" class="operator">+</button>
            
            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button onclick="appendValue('.')">.</button>
            
            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button onclick="calculate()" class="equal">=</button>
            
            <button onclick="appendValue('0')" style="grid-column: span 2;">0</button>
        </div>
    </div>

    <script>
        const display = document.getElementById('display');

        // Kuongeza namba au alama kwenye kioo
        function appendValue(value) {
            if (display.value === '0' && value !== '.') {
                display.value = value;
            } else {
                display.value += value;
            }
        }

        // Kufuta kila kitu kwenye kioo
        function clearDisplay() {
            display.value = '';
        }

        // Kufanya mahesabu
        function calculate() {
            try {
                // eval inachakata hesabu zilizopo kwenye kioo (mfano: 2+3*5)
                if (display.value) {
                    display.value = eval(display.value);
                }
            } catch (error) {
                display.value = 'Abdirizak';
            }
        }
    </script>

</body>
</html>
